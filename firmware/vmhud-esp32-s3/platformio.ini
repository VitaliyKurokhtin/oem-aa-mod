; ESP32-S3 / C3 Super Mini — VietMap BLE HUD emulator + USB CDC SPLIM bridge
; Codec: lib/vmhud/hud_codec.h (AGPL-3.0, shared with mzd-vietnav-hud)

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.3.7
build_flags =
    -DCONFIG_MBEDTLS_MD5_C=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Preferred for CMU USB host (native CDC → /dev/ttyACM*)
[env:esp32-s3-supermini]
extends = common
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
upload_speed = 921600

; Fallback if you only have a C3 Super Mini with native USB CDC
[env:esp32-c3-supermini]
extends = common
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
upload_speed = 460800
build_flags =
    ${common.build_flags}
    -DVMHUD_BOARD_C3=1
