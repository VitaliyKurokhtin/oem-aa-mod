; ESP32-S3 / C3 — VietMap BLE HUD emulator + USB CDC SPLIM bridge
; Supports both Headless (Super Mini) and Display (LilyGO T-Display S3 or I2C OLED)
; Codec: lib/vmhud/hud_codec.h (AGPL-3.0, shared with mzd-vietnav-hud)

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.3.7
build_flags =
    -DCONFIG_MBEDTLS_MD5_C=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; --- HEADLESS BOARDS (No screen) ---

; Preferred for CMU USB host (native CDC → /dev/ttyACM*)
[env:esp32-s3-supermini]
extends = common
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -DVMHUD_NO_DISPLAY=1

; Fallback if you only have a C3 Super Mini with native USB CDC
[env:esp32-c3-supermini]
extends = common
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
upload_speed = 460800
build_flags =
    ${common.build_flags}
    -DVMHUD_BOARD_C3=1
    -DVMHUD_NO_DISPLAY=1

; --- BOARDS WITH SCREEN ---

; LilyGO T-Display S3 (Built-in 1.9" ST7789 170x320 8-bit parallel color display)
[env:lilygo-t-display-s3]
extends = common
platform = espressif32@6.8.1
board = lilygo-t-display-s3
upload_speed = 115200
upload_flags =
    --no-stub
lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${common.build_flags}
    -DVMHUD_HAS_TFT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=1
    -DLCD_MODULE_CMD_1=1

; ESP32-S3 Super Mini + external I2C SSD1306 OLED (128x64)
[env:esp32-s3-oled]
extends = common
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 4MB
upload_speed = 921600
lib_deps =
    ${common.lib_deps}
    olikraus/U8g2@^2.35.19
build_flags =
    ${common.build_flags}
    -DVMHUD_HAS_OLED=1
    -DOLED_SDA=8
    -DOLED_SCL=9
