name: CI

# Catches breakage before a release tag is cut: runs the host self-tests
# (test/nav16_test), then builds both configs and packages the same
# release/debug zip artifacts the release workflow ships, plus a
# matching installer zip assembled from the release payload. The CI
# archives are versioned by short SHA instead of a tag, so what CI
# produces matches a real release.
# Tag pushes are intentionally NOT built here — release.yml owns those.
on:
  # Only main on push; PR branches are covered by pull_request below.
  # (Triggering push on all branches would double-run every push to a
  # branch that has an open PR — once for push, once for the PR.)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host self-tests — pure g++ builds that run on the runner itself, so
  # this job needs no cross toolchain and reports independently of the
  # (slower) ARM build job. Only nav16_test qualifies: gsi_test/lane_test
  # are on-device ARM tools (lane_test also needs a local-only dbus header).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build nav16_test (host g++)
        run: make -C test nav16_test

      - name: Run nav16_test
        run: ./test/build/nav16_test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The toolchain content is fixed by the submodule gitlink, so its
      # commit SHA is the natural cache key — read it straight from the
      # gitlink (no submodule checkout needed).
      - name: Resolve m3-toolchain submodule commit
        id: toolchain
        run: echo "sha=$(git ls-tree HEAD -- mazda/m3-toolchain | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache m3-toolchain (keyed on its submodule commit)
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: mazda/m3-toolchain
          key: m3-toolchain-${{ steps.toolchain.outputs.sha }}

      - name: Fetch m3-toolchain (cache miss only)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Fetch the toolchain as a plain directory (not a live git
          # submodule): clone at the pinned SHA, then drop .git. This
          # keeps the cache as plain files so it has no dangling gitlink
          # for actions/checkout's post-job `git submodule foreach`
          # cleanup to trip over (the cache restores the worktree but
          # not .git/modules/...). The build only needs the files.
          url=$(git config -f .gitmodules submodule.mazda/m3-toolchain.url)
          rm -rf mazda/m3-toolchain
          git clone --filter=blob:none "$url" mazda/m3-toolchain
          git -C mazda/m3-toolchain checkout --detach "${{ steps.toolchain.outputs.sha }}"
          rm -rf mazda/m3-toolchain/.git

      - name: Verify the cross toolchain is present and runnable
        run: |
          set -euo pipefail
          gpp=mazda/m3-toolchain/bin/arm-cortexa9_neon-linux-gnueabi-g++
          if [ ! -x "$gpp" ]; then
            echo "::error::$gpp missing — m3-toolchain submodule did not check out"
            exit 1
          fi
          if ! file "$gpp" | grep -q 'ELF'; then
            echo "::error::$gpp is not an ELF binary (Git LFS blobs not pulled?)"
            file "$gpp"
            exit 1
          fi
          "$gpp" --version | head -1

      - name: Build (release + debug)
        run: make -C mazda -j"$(nproc)" all

      - name: Stage USB installer packages
        run: |
          make -C mazda installer
          make -C mazda installer-debug

      - name: Package release + debug USB archives
        run: |
          set -euo pipefail
          VERSION="$(git rev-parse --short HEAD)"
          mkdir -p dist staging

          # Packaging: two self-contained USB installer archives
          # (Release and Debug). After unzipping, users can run make_usb.sh
          # or copy the contents directly onto their FAT32 USB drive.
          for cfg in release debug; do
            case "$cfg" in
              release)
                name="oem-aa-mod-${VERSION}"
                src_dir="mazda/build/installer"
                ;;
              debug)
                name="oem-aa-mod-${VERSION}-debug"
                src_dir="mazda/build/installer-debug"
                ;;
            esac
            stage="staging/${name}"
            mkdir -p "$stage"
            cp -r "$src_dir"/. "$stage/"

            # Catch a build that "succeeds" but links for the wrong target.
            for so in "$stage"/libpatch-*.so "$stage"/splim_seriald; do
              if [ -f "$so" ]; then
                file "$so" | grep -q 'ELF 32-bit.*ARM' || {
                  echo "::error::$so is not an ARM binary"; exit 1; }
              fi
            done

            # Wrapper dir inside the archive avoids a zip-bomb on extract.
            ( cd staging && zip -r "../dist/${name}.zip" "$name" )
          done

          ( cd dist && sha256sum ./*.zip > SHA256SUMS )
          echo "--- dist ---"
          ls -la dist
          for archive in dist/*.zip; do
            echo "--- $archive contents ---"
            unzip -l "$archive"
          done

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: oem-aa-mod-archives
          path: |
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
